<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 · Sophienoheya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f8f5f0; --cream-dark: #ede8e0;
  --gold: #b8956a; --gold-light: #d4af84; --gold-pale: #e8d5bc;
  --brown: #5c3d2e; --text: #2d2520; --text-muted: #8c7b6e;
  --text-light: #b5a699; --white: #fdfcfa; --border: rgba(184,149,106,0.18);
}
html { scroll-behavior: smooth; }
body {
  background: var(--white); color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 400; line-height: 1.8;
  overflow-x: hidden; cursor: none;
}

/* CURSOR */
.cursor { position: fixed; pointer-events: none; z-index: 9999; mix-blend-mode: multiply; }
.cursor-dot { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; transform: translate(-50%,-50%); }
.cursor-ring { width: 32px; height: 32px; border: 1px solid var(--gold); border-radius: 50%; transform: translate(-50%,-50%); transition: width 0.3s, height 0.3s, opacity 0.3s, transform 0.08s; opacity: 0.5; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(253,252,250,0.94); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 56px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo { font-family: 'Noto Serif TC', serif; font-size: 16px; color: var(--text); text-decoration: none; letter-spacing: 0.03em; transition: color 0.2s; font-weight: 400; }
.nav-logo:hover { color: var(--gold); }
.nav-links { display: flex; gap: 40px; list-style: none; }
.nav-links a { text-decoration: none; font-size: 12px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; position: relative; padding-bottom: 2px; transition: color 0.2s; }
.nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background: var(--gold); transition: width 0.3s; }
.nav-links a:hover { color: var(--gold); }
.nav-links a:hover::after { width: 100%; }
.nav-links a.active { color: var(--gold); }
.nav-links a.active::after { width: 100%; }

/* PAGE HERO */
.page-hero {
  padding: 140px 56px 80px;
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 24px;
}
.page-hero-left {}
.page-label { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; display: block; }
.page-title {
  font-family: 'Noto Serif TC', serif;
  font-size: clamp(40px, 6vw, 80px);
  font-weight: 400; color: var(--text);
  line-height: 1; letter-spacing: 0.02em;
}
.page-title span { color: var(--gold); font-weight: 400; font-style: normal; }
.page-count { font-size: 13px; color: var(--text-light); margin-top: 12px; letter-spacing: 0.06em; }

/* TABS */
.works-tabs {
  display: flex; gap: 0;
  border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  align-self: flex-end;
}
.tab-btn {
  padding: 9px 22px; font-size: 12px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-muted);
  background: none; border: none; cursor: none;
  font-family: 'Noto Sans TC', sans-serif; transition: background 0.2s, color 0.2s;
}
.tab-btn + .tab-btn { border-left: 1px solid var(--border); }
.tab-btn.active { background: var(--gold); color: white; }
.tab-btn:not(.active):hover { background: var(--cream); color: var(--text); }

/* FILTER TAGS */
.filter-bar {
  max-width: 1100px; margin: 0 auto 40px;
  padding: 0 56px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.filter-tag {
  font-size: 11px; letter-spacing: 0.08em;
  border: 1px solid var(--gold-pale); color: var(--text-muted);
  padding: 5px 16px; border-radius: 20px; background: white;
  cursor: none; transition: all 0.2s;
}
.filter-tag:hover, .filter-tag.active { background: var(--gold); color: white; border-color: var(--gold); }

/* WORKS PANEL */
.works-panel { display: none; }
.works-panel.active { display: block; }

/* GRID */
.works-section { max-width: 1100px; margin: 0 auto; padding: 0 56px 120px; }
.works-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.work-card {
  position: relative; overflow: hidden; border-radius: 3px;
  cursor: none; background: var(--cream);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
  opacity: 0; transform: translateY(24px);
  animation: cardIn 0.5s ease forwards;
}
@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}
.work-card:nth-child(3n+2) { margin-top: 32px; }
.work-card:hover { transform: translateY(-6px); }
.work-card:nth-child(3n+2):hover { transform: translateY(calc(32px - 6px)); }

.work-card-img { width: 100%; aspect-ratio: 1; background: var(--cream-dark); overflow: hidden; }
.work-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.4,0,0.2,1), filter 0.4s; }
.work-card:hover .work-card-img img { transform: scale(1.06); filter: brightness(0.92); }
.work-card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-light); font-size: 12px; }

.work-card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(44,28,20,0.7) 0%, transparent 55%);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 20px 18px; opacity: 0; transition: opacity 0.35s;
}
.work-card:hover .work-card-overlay { opacity: 1; }
.work-card-name { font-family: 'Noto Serif TC', serif; font-size: 15px; color: white; letter-spacing: 0.08em; transform: translateY(8px); transition: transform 0.35s; }
.work-card:hover .work-card-name { transform: translateY(0); }
.work-card-sub { font-size: 11px; color: rgba(255,255,255,0.65); margin-top: 3px; transform: translateY(8px); transition: transform 0.35s 0.04s; }
.work-card:hover .work-card-sub { transform: translateY(0); }

/* VIDEO GRID */
.video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.video-card { background: var(--cream); border-radius: 3px; overflow: hidden; cursor: none; transition: transform 0.3s; opacity: 0; animation: cardIn 0.5s ease forwards; }
.video-card:hover { transform: translateY(-4px); }
.video-thumb { width: 100%; aspect-ratio: 16/9; background: #1a1614; position: relative; overflow: hidden; }
.video-thumb-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s, filter 0.4s; filter: brightness(0.8); }
.video-card:hover .video-thumb-img { transform: scale(1.04); filter: brightness(0.65); }
.video-play-btn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.video-play-circle { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; transition: transform 0.3s, border-color 0.3s, background 0.3s; background: rgba(255,255,255,0.08); }
.video-card:hover .video-play-circle { transform: scale(1.12); border-color: white; background: rgba(255,255,255,0.15); }
.video-play-triangle { width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 16px solid rgba(255,255,255,0.9); margin-left: 3px; }
.video-info { padding: 16px 18px; }
.video-title { font-size: 14px; color: var(--text); }
.video-year { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* EMPTY */
.empty { text-align: center; padding: 80px; color: var(--text-light); font-size: 13px; letter-spacing: 0.1em; grid-column: 1/-1; }

/* LIGHTBOX */
.lightbox-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(20,14,10,0.88); display: flex; align-items: center; justify-content: center; padding: 40px 24px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.lightbox-overlay.open { opacity: 1; pointer-events: all; }
.lightbox-box { background: var(--white); border-radius: 3px; max-width: 980px; width: 100%; max-height: 90vh; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; transform: scale(0.96); transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); }
.lightbox-overlay.open .lightbox-box { transform: scale(1); }
.lightbox-img-wrap { background: var(--cream-dark); display: flex; align-items: center; justify-content: center; min-height: 420px; overflow: hidden; }
.lightbox-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.lightbox-img-placeholder { color: var(--text-light); font-size: 12px; letter-spacing: 0.06em; text-align: center; padding: 40px; line-height: 2; }
.lightbox-content { padding: 52px 48px; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
.lightbox-year { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 14px; }
.lightbox-title { font-family: 'Noto Serif TC', serif; font-size: 26px; font-weight: 400; color: var(--text); letter-spacing: 0.08em; line-height: 1.3; margin-bottom: 28px; }
.lightbox-text { font-size: 14px; color: var(--text-muted); line-height: 2.1; margin-bottom: 14px; white-space: pre-line; }
.lightbox-close { position: absolute; top: 20px; right: 24px; background: none; border: none; cursor: none; font-size: 24px; color: rgba(255,255,255,0.5); line-height: 1; transition: color 0.2s; z-index: 201; }
.lightbox-close:hover { color: white; }
.lightbox-nav { display: flex; gap: 10px; margin-top: 36px; }
.lightbox-nav-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: 16px; width: 36px; height: 36px; border-radius: 2px; cursor: none; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
.lightbox-nav-btn:hover { border-color: var(--gold); color: var(--gold); }

/* VIDEO LIGHTBOX */
.video-lightbox-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(8,5,3,0.95); display: flex; align-items: center; justify-content: center; padding: 40px 24px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.video-lightbox-overlay.open { opacity: 1; pointer-events: all; }
.video-lightbox-inner { width: 100%; max-width: 900px; transform: scale(0.97); transition: transform 0.4s ease; }
.video-lightbox-overlay.open .video-lightbox-inner { transform: scale(1); }
.video-lightbox-iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 2px; }
.video-lightbox-info { margin-top: 16px; display: flex; align-items: flex-start; justify-content: space-between; }
.video-lightbox-title { font-family: 'Noto Serif TC', serif; font-size: 17px; color: white; font-weight: 400; }
.video-lightbox-year { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }
.video-lightbox-close { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 24px; cursor: none; line-height: 1; padding: 0 0 0 16px; transition: color 0.2s; }
.video-lightbox-close:hover { color: white; }

/* RESPONSIVE */
@media (max-width: 768px) {
  body { cursor: auto; }
  .cursor { display: none; }
  nav { padding: 0 24px; }
  .nav-links { display: none; }
  .page-hero { padding: 100px 24px 48px; }
  .filter-bar { padding: 0 24px; }
  .works-section { padding: 0 24px 80px; }
  .works-grid { grid-template-columns: repeat(2, 1fr); }
  .works-grid .work-card:nth-child(3n+2) { margin-top: 0; }
  .video-grid { grid-template-columns: 1fr; }
  .lightbox-box { grid-template-columns: 1fr; }
  .lightbox-img-wrap { min-height: 240px; }
}
</style>
</head>
<body>

<div class="cursor" id="cursor-dot"><div class="cursor-dot"></div></div>
<div class="cursor" id="cursor-ring"><div class="cursor-ring"></div></div>

<nav>
  <a href="index.html" class="nav-logo">Sophienoheya</a>
  <ul class="nav-links">
    <li><a href="index.html#about">關於我</a></li>
    <li><a href="works.html" class="active">作品集</a></li>
    <li><a href="index.html#shop">周邊</a></li>
    <li><a href="index.html#contact">聯絡</a></li>
  </ul>
</nav>

<div class="page-hero">
  <div class="page-hero-left">
    <span class="page-label">Portfolio</span>
    <h1 class="page-title">作品<span>集</span></h1>
    <p class="page-count" id="works-count">載入中…</p>
  </div>
  <div class="works-tabs">
    <button class="tab-btn active" onclick="switchTab('illustration', this)">插畫</button>
    <button class="tab-btn" onclick="switchTab('video', this)">影片</button>
  </div>
</div>

<div class="filter-bar" id="filter-bar"></div>

<div class="works-section">
  <div id="tab-illustration" class="works-panel active">
    <div class="works-grid" id="works-grid"></div>
  </div>
  <div id="tab-video" class="works-panel">
    <div class="video-grid" id="video-grid"></div>
  </div>
</div>

<!-- VIDEO LIGHTBOX -->
<div class="video-lightbox-overlay" id="video-lightbox">
  <div class="video-lightbox-inner">
    <iframe class="video-lightbox-iframe" id="vl-iframe" src="" allowfullscreen allow="autoplay"></iframe>
    <div class="video-lightbox-info">
      <div>
        <div class="video-lightbox-title" id="vl-title"></div>
        <div class="video-lightbox-year" id="vl-year"></div>
      </div>
      <button class="video-lightbox-close" onclick="closeVideoLightbox()">×</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <div class="lightbox-box">
    <div class="lightbox-img-wrap" id="lb-img-wrap"></div>
    <div class="lightbox-content">
      <div class="lightbox-year" id="lb-year"></div>
      <h2 class="lightbox-title" id="lb-title"></h2>
      <div id="lb-body"></div>
      <div class="lightbox-nav">
        <button class="lightbox-nav-btn" onclick="navLightbox(-1)">←</button>
        <button class="lightbox-nav-btn" onclick="navLightbox(1)">→</button>
      </div>
    </div>
  </div>
</div>

<script>
// CURSOR
const dot = document.getElementById('cursor-dot');
const ring = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
function animateCursor() {
  dot.style.left = mx + 'px'; dot.style.top = my + 'px';
  rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();

// DATA
let worksData = [], videosData = [], filteredWorks = [];
let currentFilter = 'all';

async function init() {
  try {
    const [wRes, vRes] = await Promise.all([
      fetch('https://sophienoheya-api.actut24.workers.dev/api/works'),
      fetch('https://sophienoheya-api.actut24.workers.dev/api/videos')
    ]);
    worksData = await wRes.json();
    videosData = await vRes.json();
  } catch {}
  renderFilters();
  renderWorks('all');
  renderVideos();
}

// FILTERS
function renderFilters() {
  const tags = ['all', ...new Set(worksData.map(w => w.tags).filter(Boolean))];
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = tags.map(t => `
    <button class="filter-tag ${t === 'all' ? 'active' : ''}"
      onclick="filterWorks('${t}', this)">
      ${t === 'all' ? '全部' : t}
    </button>`).join('');
}

function filterWorks(tag, btn) {
  currentFilter = tag;
  document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWorks(tag);
}

function renderWorks(tag) {
  filteredWorks = tag === 'all' ? worksData : worksData.filter(w => w.tags === tag);
  document.getElementById('works-count').textContent =
    `共 ${filteredWorks.length} 件插畫作品`;
  const grid = document.getElementById('works-grid');
  grid.innerHTML = '';
  if (!filteredWorks.length) {
    grid.innerHTML = '<div class="empty">沒有符合的作品</div>'; return;
  }
  filteredWorks.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'work-card';
    card.style.animationDelay = `${Math.min(i * 0.05, 0.4)}s`;
    card.onclick = () => openLightbox(i);
    card.innerHTML = `
      <div class="work-card-img">
        ${w.img ? `<img src="${w.img}" alt="${w.title}">` : `<div class="work-card-placeholder">${w.title}</div>`}
      </div>
      <div class="work-card-overlay">
        <div class="work-card-name">${w.title}</div>
        <div class="work-card-sub">${w.year}${w.tags ? ' · ' + w.tags : ''}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function renderVideos() {
  const grid = document.getElementById('video-grid');
  grid.innerHTML = '';
  if (!videosData.length) {
    grid.innerHTML = '<div class="empty">影片作品陸續更新中 ✦</div>'; return;
  }
  videosData.forEach((v, i) => {
    const ytId = getYouTubeId(v.url);
    const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : '';
    const card = document.createElement('div');
    card.className = 'video-card';
    card.style.animationDelay = `${i * 0.08}s`;
    card.onclick = () => openVideoLightbox(i);
    card.innerHTML = `
      <div class="video-thumb">
        ${thumb ? `<img class="video-thumb-img" src="${thumb}" alt="${v.title}">` : ''}
        <div class="video-play-btn"><div class="video-play-circle"><div class="video-play-triangle"></div></div></div>
      </div>
      <div class="video-info">
        <div class="video-title">${v.title}</div>
        <div class="video-year">${v.year}${v.tags ? ' · ' + v.tags : ''}</div>
      </div>`;
    grid.appendChild(card);
  });
}

// TAB
function switchTab(name, btn) {
  document.querySelectorAll('.works-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  document.getElementById('filter-bar').style.display = name === 'illustration' ? 'flex' : 'none';
}

// LIGHTBOX
let currentIdx = 0;
function openLightbox(idx) {
  currentIdx = idx; renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function navLightbox(dir) {
  currentIdx = (currentIdx + dir + filteredWorks.length) % filteredWorks.length;
  renderLightbox();
}
function renderLightbox() {
  const w = filteredWorks[currentIdx];
  document.getElementById('lb-year').textContent = w.year + (w.tags ? ' · ' + w.tags : '');
  document.getElementById('lb-title').textContent = w.title;
  document.getElementById('lb-body').innerHTML = w.story.map(p => `<p class="lightbox-text">${p}</p>`).join('');
  document.getElementById('lb-img-wrap').innerHTML = w.img
    ? `<img src="${w.img}" alt="${w.title}">`
    : `<div class="lightbox-img-placeholder">${w.title}</div>`;
}
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === document.getElementById('lightbox')) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navLightbox(-1);
    if (e.key === 'ArrowRight') navLightbox(1);
  }
  if (document.getElementById('video-lightbox').classList.contains('open') && e.key === 'Escape') closeVideoLightbox();
});

// VIDEO LIGHTBOX
function getYouTubeId(url) {
  const m = url?.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
function openVideoLightbox(idx) {
  const v = videosData[idx];
  const ytId = getYouTubeId(v.url);
  if (!ytId) return;
  document.getElementById('vl-iframe').src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
  document.getElementById('vl-title').textContent = v.title;
  document.getElementById('vl-year').textContent = v.year + (v.tags ? ' · ' + v.tags : '');
  document.getElementById('video-lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeVideoLightbox() {
  document.getElementById('video-lightbox').classList.remove('open');
  document.getElementById('vl-iframe').src = '';
  document.body.style.overflow = '';
}
document.getElementById('video-lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('video-lightbox')) closeVideoLightbox();
});

init();
</script>
</body>
</html>
