<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理 · Sophienoheya</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f8f5f0; --cream-dark: #ede8e0;
  --gold: #b8956a; --gold-light: #d4af84; --gold-pale: #e8d5bc;
  --brown: #5c3d2e; --text: #2d2520; --text-muted: #8c7b6e;
  --text-light: #b5a699; --white: #fdfcfa; --border: rgba(184,149,106,0.2);
  --danger: #c0392b; --success: #27ae60;
}
body { background: #f0ece6; font-family: 'Noto Sans TC', sans-serif; font-weight: 300; color: var(--text); min-height: 100vh; }

/* LOGIN */
#login-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-box {
  background: var(--white); border-radius: 12px; padding: 52px 48px;
  width: 380px; text-align: center;
  border: 1px solid var(--border);
}
.login-logo { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--text); margin-bottom: 4px; }
.login-sub { font-size: 12px; color: var(--text-light); letter-spacing: 0.1em; margin-bottom: 36px; }
.login-box input[type=password] {
  width: 100%; padding: 12px 16px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--cream); font-size: 14px;
  color: var(--text); outline: none; text-align: center; letter-spacing: 0.2em;
  font-family: 'Noto Sans TC', sans-serif; margin-bottom: 12px;
  transition: border-color 0.2s;
}
.login-box input[type=password]:focus { border-color: var(--gold); background: white; }
.login-btn {
  width: 100%; padding: 12px; background: var(--gold); color: white;
  border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
  font-family: 'Noto Serif TC', serif; letter-spacing: 0.1em; transition: background 0.2s;
}
.login-btn:hover { background: var(--brown); }
.login-err { font-size: 12px; color: var(--danger); margin-top: 10px; display: none; }

/* ADMIN LAYOUT */
#admin-screen { display: none; }
.admin-top {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 40px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.admin-logo { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--text); }
.admin-logo span { color: var(--gold); font-size: 12px; margin-left: 8px; letter-spacing: 0.08em; font-family: 'Noto Sans TC', sans-serif; }
.admin-tabs { display: flex; gap: 4px; }
.admin-tab {
  padding: 6px 18px; border-radius: 6px; border: none; cursor: pointer;
  font-size: 13px; letter-spacing: 0.06em; font-family: 'Noto Sans TC', sans-serif;
  background: none; color: var(--text-muted); transition: all 0.2s;
}
.admin-tab.active { background: var(--gold); color: white; }
.admin-tab:not(.active):hover { background: var(--cream); color: var(--text); }
.logout-btn {
  font-size: 12px; color: var(--text-light); background: none; border: none;
  cursor: pointer; letter-spacing: 0.06em; transition: color 0.2s;
}
.logout-btn:hover { color: var(--danger); }

.admin-body { max-width: 1100px; margin: 0 auto; padding: 36px 40px; }

/* PANELS */
.panel { display: none; }
.panel.active { display: block; }

/* WORKS PANEL */
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}
.panel-title { font-family: 'Noto Serif TC', serif; font-size: 20px; color: var(--gold); font-weight: 300; }
.add-btn {
  background: var(--gold); color: white; border: none; border-radius: 6px;
  padding: 9px 20px; font-size: 13px; cursor: pointer; letter-spacing: 0.06em;
  font-family: 'Noto Sans TC', sans-serif; transition: background 0.2s; display: flex; align-items: center; gap: 6px;
}
.add-btn:hover { background: var(--brown); }

.works-list { display: flex; flex-direction: column; gap: 12px; }
.work-item {
  background: var(--white); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px 20px; display: flex; align-items: center; gap: 16px;
}
.work-thumb {
  width: 64px; height: 64px; border-radius: 4px; object-fit: cover;
  background: var(--cream-dark); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-light); text-align: center;
  overflow: hidden;
}
.work-thumb img { width: 100%; height: 100%; object-fit: cover; }
.work-info { flex: 1; }
.work-item-title { font-size: 15px; color: var(--text); margin-bottom: 3px; }
.work-item-meta { font-size: 12px; color: var(--text-light); }
.work-actions { display: flex; gap: 8px; }
.edit-btn, .del-btn {
  padding: 6px 14px; border-radius: 4px; font-size: 12px;
  cursor: pointer; border: 1px solid; font-family: 'Noto Sans TC', sans-serif;
  letter-spacing: 0.04em; transition: all 0.15s;
}
.edit-btn { border-color: var(--border); color: var(--text-muted); background: none; }
.edit-btn:hover { border-color: var(--gold); color: var(--gold); }
.del-btn { border-color: transparent; color: var(--text-light); background: none; }
.del-btn:hover { color: var(--danger); border-color: var(--danger); }
.drag-handle { color: var(--text-light); cursor: grab; font-size: 18px; user-select: none; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28,20,16,0.7); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: var(--white); border-radius: 10px; width: 100%; max-width: 680px;
  max-height: 90vh; overflow-y: auto;
  transform: translateY(12px); transition: transform 0.25s;
}
.modal-overlay.open .modal-box { transform: translateY(0); }
.modal-head {
  padding: 24px 28px 0; display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-family: 'Noto Serif TC', serif; font-size: 18px; color: var(--gold); font-weight: 300; }
.modal-close { background: none; border: none; font-size: 22px; color: var(--text-light); cursor: pointer; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 24px 28px 28px; }

.field { margin-bottom: 20px; }
.field label { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 11px 14px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--cream); color: var(--text);
  font-family: 'Noto Sans TC', sans-serif; font-size: 14px; outline: none;
  transition: border-color 0.2s; resize: vertical;
}
.field input:focus, .field textarea:focus { border-color: var(--gold); background: white; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* IMAGE UPLOAD */
.upload-zone {
  border: 2px dashed var(--gold-pale); border-radius: 8px;
  padding: 28px; text-align: center; cursor: pointer;
  transition: border-color 0.2s, background 0.2s; position: relative;
}
.upload-zone:hover, .upload-zone.drag-over { border-color: var(--gold); background: var(--cream); }
.upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-icon { font-size: 32px; margin-bottom: 8px; }
.upload-text { font-size: 13px; color: var(--text-muted); line-height: 1.7; }
.upload-text b { color: var(--gold); }
.upload-preview {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  border-radius: 6px; margin-top: 12px; display: none;
}
.upload-progress {
  margin-top: 12px; background: var(--cream-dark); border-radius: 4px; height: 4px; overflow: hidden; display: none;
}
.upload-progress-bar { height: 100%; background: var(--gold); width: 0%; transition: width 0.3s; }
.upload-status { font-size: 12px; color: var(--text-light); margin-top: 8px; display: none; }

.modal-footer { display: flex; gap: 12px; justify-content: flex-end; padding: 0 28px 28px; }
.save-btn {
  background: var(--gold); color: white; border: none; border-radius: 6px;
  padding: 10px 28px; font-size: 14px; cursor: pointer;
  font-family: 'Noto Serif TC', serif; letter-spacing: 0.08em; transition: background 0.2s;
}
.save-btn:hover { background: var(--brown); }
.save-btn:disabled { background: var(--gold-pale); cursor: not-allowed; }
.cancel-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 20px; font-size: 14px; cursor: pointer; color: var(--text-muted);
  font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s;
}
.cancel-btn:hover { border-color: var(--text-muted); color: var(--text); }

/* STORY FIELDS */
.story-list { display: flex; flex-direction: column; gap: 10px; }
.story-row { display: flex; gap: 8px; align-items: flex-start; }
.story-row textarea { flex: 1; min-height: 72px; }
.story-del { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 18px; padding: 8px 4px; transition: color 0.15s; flex-shrink: 0; }
.story-del:hover { color: var(--danger); }
.add-story-btn {
  background: none; border: 1px dashed var(--gold-pale); color: var(--gold);
  border-radius: 6px; padding: 8px; width: 100%; cursor: pointer; font-size: 13px;
  letter-spacing: 0.06em; transition: all 0.2s; margin-top: 4px;
  font-family: 'Noto Sans TC', sans-serif;
}
.add-story-btn:hover { border-color: var(--gold); background: var(--cream); }

/* TOAST */
.toast {
  position: fixed; bottom: 28px; right: 28px; z-index: 300;
  background: var(--text); color: white; border-radius: 8px;
  padding: 12px 20px; font-size: 13px; letter-spacing: 0.04em;
  transform: translateY(20px); opacity: 0; transition: all 0.3s;
  pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

/* EMPTY STATE */
.empty-state {
  text-align: center; padding: 64px 20px;
  color: var(--text-light); font-size: 14px; line-height: 2;
}
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }

/* SETTINGS PANEL */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.settings-card {
  background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 24px;
}
.settings-card-title { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Sophienoheya</div>
    <div class="login-sub">後台管理系統</div>
    <input type="password" id="pw-input" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">進入後台</button>
    <div class="login-err" id="login-err">密碼錯誤，請再試一次</div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="admin-top">
    <div class="admin-logo">Sophienoheya <span>後台</span></div>
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="showPanel('works', this)">插畫作品</button>
      <button class="admin-tab" onclick="showPanel('videos', this)">影片作品</button>
      <button class="admin-tab" onclick="showPanel('assets', this)">素材庫</button>
      <button class="admin-tab" onclick="showPanel('settings', this)">設定</button>
    </div>
    <button class="logout-btn" onclick="doLogout()">登出</button>
  </div>

  <div class="admin-body">

    <!-- WORKS PANEL -->
    <div class="panel active" id="panel-works">
      <div class="panel-header">
        <h2 class="panel-title">插畫作品管理</h2>
        <button class="add-btn" onclick="openModal()">＋ 新增作品</button>
      </div>
      <div class="works-list" id="works-list"></div>
    </div>

    <!-- VIDEOS PANEL -->
    <div class="panel" id="panel-videos">
      <div class="panel-header">
        <h2 class="panel-title">影片作品管理</h2>
        <button class="add-btn" onclick="openVideoModal()">＋ 新增影片</button>
      </div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:24px;">貼上 YouTube 網址，會自動抓取縮圖。</p>
      <div class="works-list" id="videos-list"></div>
    </div>

    <!-- ASSETS PANEL -->
    <div class="panel" id="panel-assets">
      <div class="panel-header">
        <h2 class="panel-title">素材庫</h2>
        <button class="add-btn" onclick="openAssetUpload()">↑ 上傳圖片</button>
      </div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:24px;">上傳到 Cloudinary 的所有圖片。點擊複製連結。</p>
      <div id="assets-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;"></div>
    </div>

    <!-- SETTINGS PANEL -->
    <div class="panel" id="panel-settings">
      <div class="panel-header">
        <h2 class="panel-title">設定</h2>
      </div>
      <div class="settings-grid">
        <div class="settings-card">
          <div class="settings-card-title">變更密碼</div>
          <div class="field"><label>新密碼</label><input type="password" id="new-pw" placeholder="輸入新密碼"></div>
          <div class="field"><label>確認密碼</label><input type="password" id="new-pw2" placeholder="再輸入一次"></div>
          <button class="save-btn" onclick="changePw()" style="width:100%">儲存密碼</button>
        </div>
        <div class="settings-card">
          <div class="settings-card-title">匯出作品資料</div>
          <p style="font-size:13px;color:var(--text-muted);line-height:1.8;margin-bottom:16px;">把目前所有作品資料匯出成 JSON 格式，可以手動貼回 portfolio.html。</p>
          <button class="save-btn" onclick="exportData()" style="width:100%;background:var(--brown)">匯出 JSON</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- WORK MODAL -->
<div class="modal-overlay" id="work-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modal-mode-title">新增作品</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>作品名稱</label>
          <input type="text" id="f-title" placeholder="例：不完美被害">
        </div>
        <div class="field">
          <label>年份</label>
          <input type="text" id="f-year" placeholder="2024">
        </div>
      </div>
      <div class="field">
        <label>系列 / 展覽名稱</label>
        <input type="text" id="f-tags" placeholder="例：多多綠展">
      </div>
      <div class="field">
        <label>作品圖片</label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" accept="image/*" onchange="handleFile(this)">
          <div class="upload-icon">🖼</div>
          <div class="upload-text">點擊或拖曳圖片到這裡<br><b>支援 JPG、PNG、WebP</b></div>
        </div>
        <img class="upload-preview" id="upload-preview">
        <div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="upload-bar"></div></div>
        <div class="upload-status" id="upload-status"></div>
        <input type="hidden" id="f-img">
      </div>
      <div class="field">
        <label>背後故事 / 靈感來源</label>
        <div class="story-list" id="story-list"></div>
        <button class="add-story-btn" onclick="addStoryField()">＋ 新增段落</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal()">取消</button>
      <button class="save-btn" id="save-btn" onclick="saveWork()">儲存作品</button>
    </div>
  </div>
</div>

<!-- VIDEO MODAL -->
<div class="modal-overlay" id="video-modal">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-head">
      <div class="modal-title" id="vmodal-title">新增影片</div>
      <button class="modal-close" onclick="closeVideoModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>YouTube 網址</label>
        <input type="text" id="vf-url" placeholder="https://www.youtube.com/watch?v=..." oninput="previewYT()">
      </div>
      <div id="yt-preview" style="display:none;margin-bottom:16px;">
        <img id="yt-thumb" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;">
      </div>
      <div class="field-row">
        <div class="field">
          <label>標題</label>
          <input type="text" id="vf-title" placeholder="影片名稱">
        </div>
        <div class="field">
          <label>年份</label>
          <input type="text" id="vf-year" placeholder="2024">
        </div>
      </div>
      <div class="field">
        <label>類別（選填）</label>
        <input type="text" id="vf-tags" placeholder="例：展覽紀錄、宣傳影片">
      </div>
    </div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeVideoModal()">取消</button>
      <button class="save-btn" onclick="saveVideo()">儲存影片</button>
    </div>
  </div>
</div>

<!-- ASSET UPLOAD MODAL -->
<div class="modal-overlay" id="asset-modal">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-head">
      <div class="modal-title">上傳圖片到素材庫</div>
      <button class="modal-close" onclick="closeAssetModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="upload-zone" id="asset-upload-zone">
        <input type="file" id="asset-file-input" accept="image/*" multiple onchange="handleAssetFiles(this)">
        <div class="upload-icon">📁</div>
        <div class="upload-text">點擊選擇或拖曳圖片<br><b>可多選</b></div>
      </div>
      <div id="asset-upload-list" style="margin-top:16px;display:flex;flex-direction:column;gap:10px;"></div>
    </div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeAssetModal()">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLOUD_NAME = 'dgru0usxn';
const UPLOAD_PRESET = 'sophienoheya';
const ASSETS_KEY = 'sophie_assets';
let AUTH_TOKEN = '';
let cachedWorks = [];

// ── AUTH ──
async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  try {
    const res = await fetch('https://sophienoheya-api.actut24.workers.dev/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (data.ok) {
      AUTH_TOKEN = data.token;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      await renderWorks();
      await renderVideos();
      renderAssets();
    } else {
      document.getElementById('login-err').style.display = 'block';
      document.getElementById('pw-input').value = '';
    }
  } catch {
    document.getElementById('login-err').textContent = '連線失敗，請重試';
    document.getElementById('login-err').style.display = 'block';
  }
}

function doLogout() {
  AUTH_TOKEN = '';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
}

async function changePw() {
  const a = document.getElementById('new-pw').value;
  const b = document.getElementById('new-pw2').value;
  if (!a) return showToast('請輸入新密碼', 'error');
  if (a !== b) return showToast('兩次密碼不一致', 'error');
  const res = await fetch('https://sophienoheya-api.actut24.workers.dev/api/password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
    body: JSON.stringify({ newPassword: a })
  });
  if (res.ok) {
    AUTH_TOKEN = a;
    showToast('密碼已更新 ✓', 'success');
    document.getElementById('new-pw').value = '';
    document.getElementById('new-pw2').value = '';
  } else showToast('更新失敗', 'error');
}

// ── PANELS ──
function showPanel(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
}

// ── API WORKS ──
async function loadWorks() {
  try {
    const res = await fetch('https://sophienoheya-api.actut24.workers.dev/api/works', { headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN } });
    cachedWorks = await res.json();
    return cachedWorks;
  } catch { return cachedWorks; }
}
async function saveWorksAPI(arr) {
  cachedWorks = arr;
  await fetch('https://sophienoheya-api.actut24.workers.dev/api/works', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
    body: JSON.stringify(arr)
  });
}

function loadAssets() {
  try { return JSON.parse(localStorage.getItem(ASSETS_KEY)) || []; } catch { return []; }
}
function saveAssets(arr) { localStorage.setItem(ASSETS_KEY, JSON.stringify(arr)); }

// ── RENDER WORKS ──
async function renderWorks() {
  const list = document.getElementById('works-list');
  list.innerHTML = '<div class="empty-state"><div class="icon">⏳</div>載入中…</div>';
  const works = await loadWorks();
  if (!works.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🎨</div>還沒有作品，點擊「新增作品」開始吧！</div>`;
    return;
  }
  list.innerHTML = works.map((w, i) => `
    <div class="work-item" data-idx="${i}" draggable="true">
      <div class="drag-handle" title="拖曳排序">⠿</div>
      <div class="work-thumb">
        ${w.img ? `<img src="${w.img}" alt="${w.title}">` : '無圖片'}
      </div>
      <div class="work-info">
        <div class="work-item-title">${w.title || '(未命名)'}</div>
        <div class="work-item-meta">${w.year || ''} ${w.tags ? '· ' + w.tags : ''} · ${w.story?.length || 0} 段故事</div>
      </div>
      <div class="work-actions">
        <button class="edit-btn" onclick="openModal(${i})">編輯</button>
        <button class="del-btn" onclick="deleteWork(${i})">刪除</button>
      </div>
    </div>`).join('');
}

// ── MODAL ──
let editIdx = null;
let uploadedImgUrl = '';

function openModal(idx = null) {
  editIdx = idx;
  uploadedImgUrl = '';
  const works = cachedWorks;
  const w = idx !== null ? works[idx] : null;
  document.getElementById('modal-mode-title').textContent = idx !== null ? '編輯作品' : '新增作品';
  document.getElementById('f-title').value = w?.title || '';
  document.getElementById('f-year').value = w?.year || new Date().getFullYear();
  document.getElementById('f-tags').value = w?.tags || '';
  document.getElementById('f-img').value = w?.img || '';
  uploadedImgUrl = w?.img || '';

  const preview = document.getElementById('upload-preview');
  if (w?.img) { preview.src = w.img; preview.style.display = 'block'; }
  else { preview.style.display = 'none'; preview.src = ''; }

  document.getElementById('upload-progress').style.display = 'none';
  document.getElementById('upload-status').style.display = 'none';

  const storyList = document.getElementById('story-list');
  storyList.innerHTML = '';
  const stories = w?.story?.length ? w.story : [''];
  stories.forEach(s => addStoryField(s));

  document.getElementById('work-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('work-modal').classList.remove('open');
}

function addStoryField(val = '') {
  const row = document.createElement('div');
  row.className = 'story-row';
  row.innerHTML = `
    <textarea placeholder="段落文字...">${val}</textarea>
    <button class="story-del" onclick="this.parentElement.remove()" title="刪除段落">×</button>`;
  document.getElementById('story-list').appendChild(row);
}

async function saveWork() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) return showToast('請填入作品名稱', 'error');
  const stories = [...document.querySelectorAll('#story-list textarea')]
    .map(t => t.value.trim()).filter(Boolean);
  const work = {
    title,
    year: document.getElementById('f-year').value.trim(),
    tags: document.getElementById('f-tags').value.trim(),
    img: uploadedImgUrl || document.getElementById('f-img').value.trim(),
    story: stories
  };
  const works = [...cachedWorks];
  if (editIdx !== null) works[editIdx] = work;
  else works.push(work);
  document.getElementById('save-btn').disabled = true;
  document.getElementById('save-btn').textContent = '儲存中…';
  await saveWorksAPI(works);
  document.getElementById('save-btn').disabled = false;
  document.getElementById('save-btn').textContent = '儲存作品';
  closeModal();
  await renderWorks();
  showToast(editIdx !== null ? '作品已更新 ✓' : '作品已新增 ✓', 'success');
}

async function deleteWork(idx) {
  if (!confirm('確定要刪除這件作品嗎？')) return;
  const works = [...cachedWorks];
  works.splice(idx, 1);
  await saveWorksAPI(works);
  await renderWorks();
  showToast('作品已刪除', '');
}

// ── CLOUDINARY UPLOAD ──
async function uploadToCloudinary(file, onProgress) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100));
    };
    xhr.onload = () => {
      if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
      else reject(new Error('上傳失敗'));
    };
    xhr.onerror = () => reject(new Error('網路錯誤'));
    xhr.send(formData);
  });
}

async function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const preview = document.getElementById('upload-preview');
  const progress = document.getElementById('upload-progress');
  const bar = document.getElementById('upload-bar');
  const status = document.getElementById('upload-status');
  const saveBtn = document.getElementById('save-btn');

  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  progress.style.display = 'block';
  status.style.display = 'block';
  status.textContent = '上傳中…';
  status.style.color = 'var(--text-light)';
  saveBtn.disabled = true;

  try {
    const res = await uploadToCloudinary(file, pct => {
      bar.style.width = pct + '%';
    });
    uploadedImgUrl = res.secure_url;
    document.getElementById('f-img').value = uploadedImgUrl;
    preview.src = uploadedImgUrl;
    status.textContent = '✓ 上傳成功';
    status.style.color = 'var(--success)';

    // 儲存到素材庫
    const assets = loadAssets();
    assets.unshift({ url: uploadedImgUrl, name: file.name, date: new Date().toLocaleDateString('zh-TW') });
    saveAssets(assets);
    renderAssets();
  } catch (e) {
    status.textContent = '✗ 上傳失敗，請再試一次';
    status.style.color = 'var(--danger)';
  } finally {
    saveBtn.disabled = false;
  }
}

// ── ASSETS ──
function renderAssets() {
  const assets = loadAssets();
  const grid = document.getElementById('assets-grid');
  if (!assets.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">🖼</div>素材庫是空的，先上傳一些圖片吧！</div>`;
    return;
  }
  grid.innerHTML = assets.map((a, i) => `
    <div style="cursor:pointer;position:relative" onclick="copyUrl('${a.url}')" title="點擊複製連結">
      <img src="${a.url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--border)">
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.name}</div>
      <div style="font-size:10px;color:var(--text-light)">${a.date}</div>
      <button onclick="event.stopPropagation();deleteAsset(${i})" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.5);border:none;color:white;border-radius:4px;padding:2px 6px;font-size:11px;cursor:pointer">✕</button>
    </div>`).join('');
}

function openAssetUpload() { document.getElementById('asset-modal').classList.add('open'); }
function closeAssetModal() { document.getElementById('asset-modal').classList.remove('open'); renderAssets(); }

async function handleAssetFiles(input) {
  const files = [...input.files];
  const listEl = document.getElementById('asset-upload-list');
  for (const file of files) {
    const row = document.createElement('div');
    row.style = 'display:flex;align-items:center;gap:12px;font-size:13px';
    row.innerHTML = `<span style="flex:1;color:var(--text-muted)">${file.name}</span><span class="prog-text" style="color:var(--text-light)">等待中…</span>`;
    listEl.appendChild(row);
    const prog = row.querySelector('.prog-text');
    try {
      prog.textContent = '上傳中…';
      const res = await uploadToCloudinary(file, pct => prog.textContent = pct + '%');
      const assets = loadAssets();
      assets.unshift({ url: res.secure_url, name: file.name, date: new Date().toLocaleDateString('zh-TW') });
      saveAssets(assets);
      prog.textContent = '✓ 完成';
      prog.style.color = 'var(--success)';
    } catch {
      prog.textContent = '✗ 失敗';
      prog.style.color = 'var(--danger)';
    }
  }
}

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => showToast('連結已複製 ✓', 'success'));
}

function deleteAsset(idx) {
  const assets = loadAssets();
  assets.splice(idx, 1);
  saveAssets(assets);
  renderAssets();
}

// ── VIDEOS ──
let cachedVideos = [];
let videoEditIdx = null;

async function loadVideos() {
  try {
    const res = await fetch('https://sophienoheya-api.actut24.workers.dev/api/videos', { headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN } });
    cachedVideos = await res.json();
    return cachedVideos;
  } catch { return cachedVideos; }
}
async function saveVideosAPI(arr) {
  cachedVideos = arr;
  await fetch('https://sophienoheya-api.actut24.workers.dev/api/videos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
    body: JSON.stringify(arr)
  });
}

function getYouTubeId(url) {
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

async function renderVideos() {
  const list = document.getElementById('videos-list');
  list.innerHTML = '<div class="empty-state"><div class="icon">⏳</div>載入中…</div>';
  const videos = await loadVideos();
  if (!videos.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🎬</div>還沒有影片，點擊「新增影片」開始吧！</div>`;
    return;
  }
  list.innerHTML = videos.map((v, i) => {
    const ytId = getYouTubeId(v.url || '');
    const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : '';
    return `
    <div class="work-item" data-vidx="${i}">
      <div class="work-thumb" style="background:${thumb ? 'none' : 'var(--cream-dark)'};overflow:hidden;">
        ${thumb ? `<img src="${thumb}" style="width:100%;height:100%;object-fit:cover;">` : '無縮圖'}
      </div>
      <div class="work-info">
        <div class="work-item-title">${v.title || '(未命名)'}</div>
        <div class="work-item-meta">${v.year || ''} ${v.tags ? '· ' + v.tags : ''}</div>
      </div>
      <div class="work-actions">
        <button class="edit-btn" onclick="openVideoModal(${i})">編輯</button>
        <button class="del-btn" onclick="deleteVideo(${i})">刪除</button>
      </div>
    </div>`;
  }).join('');
}

function openVideoModal(idx = null) {
  videoEditIdx = idx;
  const v = idx !== null ? cachedVideos[idx] : null;
  document.getElementById('vmodal-title').textContent = idx !== null ? '編輯影片' : '新增影片';
  document.getElementById('vf-url').value = v?.url || '';
  document.getElementById('vf-title').value = v?.title || '';
  document.getElementById('vf-year').value = v?.year || new Date().getFullYear();
  document.getElementById('vf-tags').value = v?.tags || '';
  previewYT();
  document.getElementById('video-modal').classList.add('open');
}
function closeVideoModal() { document.getElementById('video-modal').classList.remove('open'); }

function previewYT() {
  const url = document.getElementById('vf-url').value;
  const ytId = getYouTubeId(url);
  const preview = document.getElementById('yt-preview');
  if (ytId) {
    document.getElementById('yt-thumb').src = `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

async function saveVideo() {
  const url = document.getElementById('vf-url').value.trim();
  const title = document.getElementById('vf-title').value.trim();
  if (!url) return showToast('請填入 YouTube 網址', 'error');
  if (!getYouTubeId(url)) return showToast('網址格式不正確', 'error');
  if (!title) return showToast('請填入影片標題', 'error');
  const video = {
    url, title,
    year: document.getElementById('vf-year').value.trim(),
    tags: document.getElementById('vf-tags').value.trim()
  };
  const videos = [...cachedVideos];
  if (videoEditIdx !== null) videos[videoEditIdx] = video;
  else videos.push(video);
  await saveVideosAPI(videos);
  closeVideoModal();
  await renderVideos();
  showToast(videoEditIdx !== null ? '影片已更新 ✓' : '影片已新增 ✓', 'success');
}

async function deleteVideo(idx) {
  if (!confirm('確定要刪除這部影片嗎？')) return;
  const videos = [...cachedVideos];
  videos.splice(idx, 1);
  await saveVideosAPI(videos);
  await renderVideos();
  showToast('影片已刪除', '');
}

document.getElementById('video-modal').addEventListener('click', function(e) { if (e.target === this) closeVideoModal(); });

// ── EXPORT ──
function exportData() {
  const json = JSON.stringify(cachedWorks, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'works-data.json';
  a.click();
  showToast('已匯出 works-data.json', 'success');
}

// ── TOAST ──
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ── DRAG TO REORDER ──
let dragSrc = null;
document.getElementById('works-list').addEventListener('dragstart', e => {
  dragSrc = e.target.closest('.work-item');
  if (dragSrc) dragSrc.style.opacity = '0.5';
});
document.getElementById('works-list').addEventListener('dragend', () => {
  document.querySelectorAll('.work-item').forEach(el => el.style.opacity = '');
});
document.getElementById('works-list').addEventListener('dragover', e => {
  e.preventDefault();
  const target = e.target.closest('.work-item');
  if (target && target !== dragSrc) {
    const rect = target.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height / 2;
    target.parentNode.insertBefore(dragSrc, before ? target : target.nextSibling);
  }
});
document.getElementById('works-list').addEventListener('drop', async e => {
  e.preventDefault();
  const items = [...document.querySelectorAll('.work-item')].map(el => parseInt(el.dataset.idx));
  const reordered = items.map(i => cachedWorks[i]);
  await saveWorksAPI(reordered);
  await renderWorks();
  showToast('順序已儲存 ✓', 'success');
});

// Close modal on overlay click
document.getElementById('work-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('asset-modal').addEventListener('click', function(e) { if (e.target === this) closeAssetModal(); });
</script>
