<script>
const WORKS = [{"title":"不完美被害","year":"2023","tags":"多多綠展","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778468101/wtwxdhtjjq6ub3aumlfx.png","story":["大學有段時間過的很荒腔走板，就是一輩子沒想過會發生在自己身上的事都發生了，然後兀自被情緒帶走，總是做最不理智的選擇。\n\n結束那段混沌期的句號畫得很糟，到現在要啟齒都還覺得困難的程度。事發的瞬間一片空白，不敢相信。事後花了一段時間意識到，那好像可以稱之為被害。\n但每當回頭想到當時猶如飛蛾撲火般，著迷於煙霧繚繞的背影的自己，就又會把意圖指控的話噎回去。\n當阻止的行動無人目睹，過去外顯的相處模式又像自己玩火，指控只會變成可以拿來訕笑你終於自焚的把柄。\n\n就像曾經要好的A說：所以你當初不要⋯⋯，那就不會⋯⋯。\n\n畢竟時間無法倒轉，至今我也不知道是不是真的如A所說，當初不要、那就不會。"]},{"title":"女","year":"2023","tags":"多多綠","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778666706/dw1x30wp9olpfzrzwhvo.png","story":["大概國小的某時期意識到性向之於我是流動的。\n當時的我可能對性向這個詞都不甚解，僅僅是意識、然後順應，沒經過什麼掙扎或困擾。\n\n單純就是發現自己喜歡了，那就喜歡吧！\n不想想那麼多，反正滿開心的。\n\n（想想，真的從小就很隨意）\n\n有朋友問過、我也回想過，跟男生或女生在一起的感受有沒有明確的差異。比如是不是男女思考邏輯是不是真的不同？女女是不是比較容易惺惺相惜？\n\n但我的結論最後還是體驗跟性別無關。\n重點還是對方是怎樣的個體，他的生命經驗、性格、生活方式、價值觀是如何，僅此而已。"]},{"title":"哭","year":"2023","tags":"多多綠","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778666763/nfgwrmy5u3azthkm5d9t.png","story":["還沒創這個帳號以前，大一有段時間我很喜歡在課間、筆記本上畫畫，然後發在個人社群上。\n當時還不會電繪，用原子筆畫了一個半泡在水裡的人。\n構圖跟這張有點類似，但沒有花、也沒有顏色，讓表情看起來更難過。\n畫圖的當下好像正在總圖地下室，打算通宵K期中（會計系真的好多考試，恨！）\n於是畫了一張很悲的圖，不過畫完心情就好了，要讀討厭科目的煩躁感少了很多。\n有時候生活也會有這種感覺，因為難過或生氣的事哭了，眼淚灌溉了花，最後情緒發洩完了，心情還是會再次綻放。\n\n希望就像畫，淚之池上能常綻美麗的荷花。"]},{"title":"愛漂亮","year":"2023","tags":"多多綠","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778666830/shnaexbd1ajgtizoulxg.png","story":["不知道大家看的順序是如何，不過如果是按照順序應該已經知道我很愛漂亮。\n\n相信認識我的人日常生活中也都感受得到XD\n小時候在長輩的誇讚聲中收穫自信，不過越大越會挑自己毛病。\n不喜歡自己的部分很多，內在外在都有。\n\n（之前寫過一篇細節的紀錄，不過放上來太恥了。）\n\n而知曉當他擁抱著我，卻同時也用目光和體溫品嚐別人時，我發現可以用統計學跟心理學試圖同理對方，但沒辦法改變的是對自我更多的厭惡。\n\n於是時而積極的想改變，時而逃避的想：\n算了，反正一切已經無濟於事\n然後倒臥在沙發上邊吃麥片邊看電影。"]},{"title":"背面","year":"2023","tags":"多多綠","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778666934/hcsoz88qywnnarjurzkr.png","story":["這其實是個抱著自己的人，但畫技不佳看不太出來。\n\n我是個情緒走在理智前面的人，而且越小的時候越藏不住。身體也總是比大腦先反應，或哭或笑，都比言語更快表達出來。\n\n所以真的不想被人覺察的時候，背對好像就是最佳解。最不費力，又自然。\n\n21歲經過很多掙扎，有些想法跟價值彷彿被打碎又重組了。\n\n日復一日，一個人待在三坪的小房間，始終無法緩解的焦慮像蟲啃咬著身體，我完全坐不住。剛坐下五分鐘就要站起來，然後一遍又一遍順著房間的牆緣繞著，好像馬拉松跑者，喘不過氣的部分也像。\n有時候也會沿著萬壽橋河堤走，走到曾經聊心事練歌的小公園旁坐下，然後哭。\n哭完再慢慢走回家，看個電影、睡覺。\n\n不過回頭看很感謝那段時間，痛苦但同時打開了許多念想。也感謝用盡努力理解一切的自己。\n致那些背對著世界，抱緊自己的夜晚。"]},{"title":"探索","year":"2023","tags":"多多綠","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778666999/uqccfgolgkp9rmff0n8s.png","story":["為什麼這幅叫探索？\n：不覺得這個樣態有點像是在上面或結束之後，坐在床緣的樣子嗎？\n\n其實這篇特別難下筆。\n\n雖然生活在一個相對開放的時代，某部分的我也覺得性慾跟食慾一樣正常，但真的要主動開啟相關話題，還是一件滿困難的事。\n（而且我的形象來談好像很違和？？不知道，只記得從熱舞社朋友口中聽過：他看來就是不會玩的人）\n\n這裡不想談蕩婦羞辱或是女權，也沒有要說教，單純談談性之於我。\n從身邊朋友的分享對比自己，我可能比一般人（或至少生理女）更早開始對性感到好奇。\n\n當時亟欲從文字、漫畫、影劇、成人影片裡找答案，過程害怕被發現而心跳加速，同時又沒來由的感到羞恥，這種複雜的感受讓我一度有點上癮。\n\n直到現在我還是容易被比較煽情或頹靡的作品吸引，也特別喜歡看起來慵懶勾人的眼睛。（可能也是這樣，我的創作中最喜歡的都還是那些，彷彿盯著螢幕、有下垂睫毛和神情迷迷糊糊的作品）"]},{"title":"偶像包袱","year":"2023","tags":"多多綠","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667095/g5pnaud8dee1vrufxbzp.png","story":["經過幻想當公主的童年，本來以為長大會順利去掉包袱，結果不是。\n病還是沒好，青春期尤其。\n就是大家說一起做鬼臉拍照吧，最後檢查照片會被打的那種人。\n \n印象比較深刻的是高中畢業照，當時亟欲擺脫偶包標籤的我，跟著一群比較有趣的朋友拍了各種莫名其妙的照片。比如：情境是老人過馬路，我們6 人一人當老人、一人當拐杖、一人當紅綠燈，剩下三個人當斑馬線。\n\n團體照就算了，畢竟跟朋友一起胡鬧的當下滿好玩的。但當時想不開，跟同群朋友說好，個人照要一起擺臭臉、雙手握住眼前虛擬的鐵杆，假裝被關在考試的監牢裡。\n\n當時還以為畢冊美編會幫我們P上鐵窗欄杆，減少我們的不知所云，結果根本沒有，導致照片看起來非常癡呆＾＾\n偶包沈重如我，收到畢冊其實超級後悔哈哈哈哈...\n\n不過現在回去翻畢業紀念冊想起拍攝那一天，還是會被荒謬的記憶逗笑。"]},{"title":"揉眼睛","year":"2023","tags":"多多綠","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667187/iruajkinsbf3la8nluws.png","story":["從有記憶以來就非常喜歡揉眼睛。小時候可能是源自過敏的癢，青春期開始應該大多是隱形眼鏡的鍋。\n\n愛漂亮，所以討厭厚重的眼鏡。\n\n從國中開始偷帶隱形眼鏡可以說是青春初期的知其不可而為之，叛逆的練習？\n\n總之，因爲上課整天、下課補習，其實很容易超過包裝上建議的最佳配戴時長。雖然有眼睛不乾澀這個天大的優點（缺點是我總因此毫無節制的亂使用我的眼睛），但拿下隱形眼鏡的瞬間常感覺癢，然後開始爆揉一波。\n\n據父母跟看過我揉眼睛的朋友、同事、同學說：我好像要把眼珠揉出來似的，很可怕。\n\n燈愣，結果不知不覺講成一個鬼故事。"]},{"title":"那些時光","year":"2023","tags":"多多綠","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667240/krtc9qhfbzuobp176sci.png","story":["小時候，爸爸很喜歡從阿波羅（後來變成白鹿洞）租片回家。\n\n有時候我跟姊姊也會跟著一起去，挑幾片我們想看的卡通，或以狗為主角的電影回家。\n一次抱回家的片大概4-7部不等，大部分是爸爸想看的。偶爾無聊經過客廳，我也會坐下來一起看。當時比較像雜食，囫圇吞棗下很多內容，但對於自己真正喜歡什麼並沒有太多探索或意識。\n然後中間經過了一個大斷層。回想起來可能忙於讀書、才藝、玩社團，還有各式各樣新興的娛樂吧，幾乎沒什麼看電影的時間或機會。\n再次比較大量攝食電影是大學時期（感謝偉哉政大驚人的藏片數量，還有你），也開始漸漸辨認、建立起自己的喜好。\n\n我很喜歡用一首歌、一部劇或電影，甚至一條路去記憶某時期。即使生活是流動的，我不會因為過了那段時間，就再也不聽某首歌、不經過某條路，不過總是很自然而然的，就變成了這樣。\n\n就如同圖中這些台詞或歌詞，對我而言不單純是字面上的意義，也是某個重要的記憶片段。"]},{"title":"射手","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667302/aw7narzty1hhcymyev0w.png","story":["射手座對我來說也滿有鋒芒的，\n不過可能是因為我們真的太不相同了，所以那個鋒芒不會刺到我，而是讓我很羨慕。\n\n周遭射手座的朋友大多都滿有自信的，心裡如果有不確定或怕怕的狀態也都會收的很好。\n彷彿世界上所有的困難都不是困難，因為只要他願意做，就所有挑戰都會被完美ＫＯ！\n對於喜歡的事物會流露出銳利、發著光的眼睛（跟獅子座有點像）\n還是不拘小節冠軍，跟著射手座朋友一起胡鬧是最快樂的！\n\n射手座朋友の特點觀察：\n\n1. 自由的靈魂2號，與其說對體制或框架是不在乎，感覺有更多衝撞的慾望（不過也可能流於想想，因為覺得很麻煩）\n2. 怕麻煩，情感上糾葛的麻煩、繁瑣重複的小細節等，種種麻煩都不喜\n3. 真誠冠軍，常常不加修飾（玻璃心如我有時候會：痾啊！），跟射手相處真的不用猜！\n\n點播一首給射手座朋友：傻子與白痴-HoydeA"]},{"title":"天蠍","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667382/ffyqges2c4u6he6anofb.png","story":["我的月亮星座在天蠍，爸爸姊姊也都是天蠍，所以對這個星座很熟悉，也能很自在的相處。\n\n人家都說月亮星座是真正放鬆時會展現的樣子，所以我對大家普遍覺得天蠍麻煩的地方很可以同理ＸＤ\n因為我也常覺得自己真的好機車哈哈哈哈\n真是辛苦跟我親近的大家了ＱＱ\n\n不認識的時候常透露著一種不要來冒犯我的氣質\n同時有很高的感受力，所以有時候會為了不要那麼累關上共感開關。\n我常覺得天蠍只是看似冷漠，內心有很多波濤洶湧。\n （打到這裡想到范保德裡那句：故作無情，正是保護深情的方法）\n\n天蠍座朋友の特點觀察：\n1. 氣質都滿清冷的\n2. 思考的很深、可以當引路人，但可能不會自己說出來\n3. 感受力100分，有些人因為太會感受只好乾脆忽略會讓他痛苦的議題不看\n\n點播點播：莉莉周她說-愛人"]},{"title":"天秤","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667450/c7tbfhult0hmxhskk0s5.png","story":["從小時候到現在，我一直都有很多天秤座朋友，總是一開始聊天就會有一間如故的感覺ＸＤ\n\n大部分身邊的天秤朋友都很隨和，看似對很多事沒什麼想法。\n\n常常：好啊好啊～掛在嘴邊\n不過隨著認識越深，會越看得到他們真正最在乎的、堅持的原則是什麼（其實也不是如表面什麼都好）\n\n天秤座的朋友常常讓我想到幾個詞：從容、優雅，不管再糟的狀態總是能維持在一個標準上現身（也可能是不到這個標準他們就不會跟我見面了ＸＤ）\n\n天秤座朋友の特點觀察：\n1. 帥哥美女最多的星座無誤\n2. 心裡深層的想法大多只有熟悉的人會最赤裸的看到\n3. 很在乎公不公平，不少行動的出發點都是為求（他心中的）公平\n\n點播一首：冰球樂團-搖啊搖"]},{"title":"處女","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667546/hyht2q5pbdyq1lb1svmz.png","story":["人生前半（學生時代）真的沒什麼處女座的朋友。唐老師說雙魚跟處女是對宮星座，看起來很不一樣，但思想本質上滿相近的。\n\n可能是年紀越大越看得清，我也越來越覺得是這樣。\n雖然表達方式通常都差滿多的，但跟很多處女座朋友聊天都會發現做出這個表達或行動的動機跟思考路線很相近！\n然後處女座的朋友也隨年紀成長越來越多ＸＤ\n\n當他們熱愛一件事的時候，投入的專心程度跟這個熱忱延續的長度常常讓我覺得不可思議。當真的夠喜歡，不管這件事有多大的挑戰跟困難處女座朋朋們總是會眉頭深鎖，但按部就班、完成度很高的打完怪，最後一派輕鬆的分享經驗給其他人。\n\n處女座朋友の特點觀察：\n\n1. 不一定有潔癖，但通常有某一個點是很堅持的（比如：絕對不能遲到、不能不洗澡躺床 之類的）\n2. 絕對的務實派，會覺得空氣求婚浪漫但不會想要自己收到\n3.  上工狀態跟放鬆狀態滿像人格分裂的，感覺是完全不同人ＸＤ\n\n點一首莫名覺得很適合的歌給處女座朋友：蘇打綠-無與倫比的美麗"]},{"title":"獅子","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667622/sopnwzqbzu0pgmrjc93x.png","story":["獅子座的朋友跟雙子一樣，我也是又愛又恨哈哈哈\n\n我跟身邊大部分的獅子座朋友都滿好的，不過一旦開始太過親近或常相處，有些點上會出現小小的抗拒心理。\n\n可能他們總是有我嚮往的勇氣與行動力，同時又可以激起我內心的好強因子吧！\n好勝心被激發了之後，卻發現自己比不過他們的耀眼，然後就生氣ㄌ\n（娃，好小心眼的發言ＸＤ）\n\n不過獅子座算是我覺得跟刻板印象最接近的星座ＸＤ真的通常都愛面子，自尊心高，同時也有很強的保護慾，有幸當獅子座的朋友或下屬真ㄉ滿幸福的！（有時候還會流露霸道總裁的一面，愛ㄌ！）\n\n獅子座朋友の特點觀察：\n\n1. 感覺都可以很快在一個團體裡交到朋友\n2. 會有很明確的興趣（可能不只一個），這些興趣也大多是可以展現成果給其他人看的\n3. 能量用不完！很少看到獅子座弱弱的樣子，可能都被藏起來了\n\n \n\n點播一首獅子座朋友的歌：\n老王樂隊-我還年輕 我還年輕"]},{"title":"巨蟹","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667681/kaim31y2v2qokoxmxku9.png","story":["大家都說雙魚座跟巨蟹座很合，不過我巨蟹座的朋友又不多了ＸＤ\n \n不過我對巨蟹座朋友的印象都很深刻\n記得高中時候遇到的巨蟹座朋友都很顛覆刻板印象，本來以為巨蟹很溫和、柔柔弱弱的，但我當時遇到的巨蟹都很堅毅，而且有強大的氣場（我會怕的那種）\n後來發現是巨蟹們好像隨著我們之間關係、各自扮演的不同，看到的面向會很迥異\n\n當然人都有很多面向，但我覺得巨蟹在扮演各個角色真的滿迥異的。不管哪種角色都可以從內在清楚識別、再好好扮演的感覺！（比如工作的時候是冷面機器人，談戀愛的時候放閃也是完全沒在客氣）\n\n\n巨蟹座朋友の特點觀察：\n\n1. 通常都很自律（至少在工作或學業上）\n2. 比起多樣興趣，更擅長專精在單一領域（變成超級專家，好猛）\n3. 還不熟的時候生人勿近或客氣100分（官腔），熟了之後就沒這回事ㄌ\n\n點播一首：動物園釘子戶-一個人在湖濱公園"]},{"title":"雙子","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667759/bx0gwvk81xswohvbgfdq.png","story":["我常覺得我跟某些雙子座的朋友滿像的，但他們幫我把更多我在內在分裂的思想表達了出來。\n可能也是因為這些像又不像，讓小時候的我會突然看不慣雙子座ㄉ朋友ＸＤ\n可能是我想講的話被說出口了，還大機率是還是不加修飾的，發現自己也是同樣想法的我覺得好討厭喔，大概是這種心情吧！\n\n不過圓融、活潑的外顯特質之外，雙子座朋朋在私人空間或自己的思想世界裡也滿沈靜的，想的多也看的準、悠遠且深長\n\n雙子座朋友の特點觀察：\n\n1. 大部分都伶牙俐齒的，反應很快，善辯\n2. 有些自我的堅持的點旁人看起來會覺得怪怪的ＸＤ\n3. 興趣廣泛，喜歡探索未知的事情（僅限有體力跟心情的時候）\n\n雙子座的朋友，來首：Vaundy-東京フラッシュ吧！"]},{"title":"金牛","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667803/emhiovhzzodrjjctpn6d.png","story":["身邊遇到的金牛座朋友不多，印象中的他們都散發一種溫柔，平實的感覺。\n常常能感知到周遭人的心情，也會散發出對自己在乎的人事物，很保護的感覺。\n然後普遍也都很熱心，不管是單純對社會、世界議題的關注，或對身邊的人也大多慣於多付出一份溫暖跟關懷。\n\n雖然刻板印象都會說金牛很計較、很在乎錢，不過我個人的觀察是金牛座的朋朋只是很在乎是不是能『實際』或『親身感受』到回應。雖然你不給他們相應的回饋也不會被報復或怎麼樣，但漸漸會被金牛丟出他們的關心之人aka朋友名單外，而且一去不復返ＸＤ\n\n金牛座朋友の特點觀察：\n\n1. 務實，絕對是務實計畫派\n2. 對於付出會不會收到回饋滿在意的，會期待收到能達到他心中標準的回應\n3.  平常很溫和，但有不速之客要擅闖進私領域，或對他在乎的人不利時會立刻武裝起來\n\n幫金牛朋友點播一首：milet- Ordinary days"]},{"title":"牡羊","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667876/gf6bmln7nwmoipiesckg.png","story":["大部分身邊牡羊座的朋友都有孩子氣，或說朝氣的一面。\n印象中跟牡羊座的朋友或夥伴一起工作的時候氣氛通常都很愉快，很累的事情從他們眼中看出去彷彿都變成了一場場遊戲、一道道關卡。\n\n可能這也是為何牡羊座朋友，總有源源不絕的動力\n前面有困難嗎？沒關係我不怕，來吧！的那種感覺很可愛。\n充滿愛又真誠的眼神，跟他們相處的當下好像煩惱都不見了！\n\n\n牡羊座朋友の特點觀察：\n\n1. 大部分長相（或氛圍）都比實際年紀年輕\n2. 普遍都有少女心，看到貓貓狗狗、娃娃、他的價值觀覺得漂亮可愛的東西會發出少女呼喊\n3. 以行動來看，其實大部分時間都沒有像大家以為的那麼衝動（但心裡可能已經大喊：衝了！無數次）\n\n點播一首給牡羊座朋友：張懸-兒歌"]},{"title":"雙魚","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778667919/nbv2fgpcvyvyxqtvrwuk.png","story":["同性相吸？的關係，我身邊也好多好多雙魚座朋友，大家也都跟我有某部分是很類似的。\n雙魚朋友們大多擁有非常氾濫的同情/理心，不過每個個體呈現的方式不盡相同。\n我遇過用理性提供解決方式的雙魚座、也遇過單純陪伴給予溫暖的雙魚座，也有表達方式一直變來變去的雙魚座ＸＤ\n不得不說我們真的滿善變的，但也因此，雖然會有喜好差異，但好像沒什麼無法融入的環境\n\n我們也都更願意相信世界上大多是好人、相信好意，可能是源於希望一切都是理想的，旁人可能會覺得天真。\n不過其實我們可以很快看清事態，然後選擇性的知而不言。\n\n雙魚座朋友の特點觀察：\n\n1. 真的滿喜歡幻想的，但完全不等於不現實/務實\n2. 普遍都會說自己不像雙魚座ＸＤ\n3. 自省能力滿高的，其實很瞭解自己（說不了解可能只是不想承認）\n\n點播一首給雙魚座朋友：Gigi Cheung-深夜浪漫"]},{"title":"水瓶","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778668016/yhlikup5vzfytkvdseog.png","story":["生命中遇過很多水瓶座，一度是水瓶粉\n\n常常擔心在這些朋友眼裡我很無聊，\n畢竟他們通常都很聰明（或是很怪），\n涉略的事物也都很廣，重點是對於喜好會深入了解（深深深深入的那種）。\n\n搞得我有時候會不敢在他們面前說自己喜歡什麼，擔心會被接下來要聊的話題深度打敗ＸＤ\n\n難以捉摸的氣質跟貓有點像，但偏偏就是這種抓不住的感覺最迷人，所以送了隻一樣迷樣又充滿魅力ㄉ黑貓給水瓶座朋友們\n（怎麼講半天發現我還是水瓶粉絲？！）\n\n水瓶座朋友の特點觀察：\n1. 真的好聰明，氣！\n2. 如果可以一句話概括，真的就是自由的靈魂\n3. 還不熟的時候通常都會有種冷冷的氣質，好像先被看穿就輸ㄌ\n\n我想送水瓶座朋友ㄉ歌：椅子樂團- Rollin' On"]},{"title":"摩羯","year":"2023","tags":"玄之又玄","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778668083/tggb8dvzou41euyetal8.png","story":["對我來說最難以歸類，沒有形狀的一群人。\n\n從小到大每次跟我說自己是摩羯座的人，特質跟最鮮明的部分都不太一樣\n所以每次感覺不出來是什麼星座我都先猜摩羯ＸＤ\n\n雖然明確知道人各有異，本來就不能用星座去歸類但畢竟還是大數據\n不知道為什麼我生命中的摩羯座感覺都是離群值，有趣！\n目前只能模糊地說出：摩羯座都是工作狂ＸＤ 但不是無限制奴奴的那種，是帶有思想，渴望進化的工作狂狀態！\n\n摩羯座朋友の特點觀察：\n\n1. 害怕被說是無聊的人，通常也都滿幽默的\n2. 生命各階段至少會有一件很投入且負責的事。\n3. 普遍不太對外直接展露生氣或負面的情緒，可能會先忍，然後用其他方式表達出來（理性先行？）\n\n為摩羯朋友點播：YOASOBI- 群青"]},{"title":"摩托車","year":"2024","tags":"","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778668130/n7pbohvhbc70pkias3pu.png","story":["收假。\n上班族的生活在兩點一線中反覆\n工作、吃飯、再工作、回家\n星期一、星期二、星期三、星期四、星期五\n\n不管是陰雨綿綿的寒流早晨\n還是艷陽高照的悶熱午後。\n\nC沒有學生時代的隨心所欲\n：可以泡著在電影院 睡著又醒來的好日子\n發覺人終究得在生存與生活之間游離\n賴床時分思索著存在的意義\n問著自己：真的需要這份工作嗎？\n必要支出離開戶頭的瞬間\n又得取捨掉部分無法變現的生活\n\n不管幾歲還是貪心\n魚與熊掌都想兼得\n只好在循環著的日常裡\n選擇在假日的夕陽下騎著腳踏車\n迎面享受著溫柔的風\n和斜斜撒下的金黃\n那樣有限的浪漫"]},{"title":"失重","year":"2026","tags":"","img":"https://res.cloudinary.com/dgru0usxn/image/upload/v1778668240/f0nikoawvqdmmg9gzrit.png","story":["當停滯的慣性甦醒，不是等速推移\n凍結又重啟的時間像短暫失速後恢復的電梯\n\n在隨機落定，門驟然開啟之際，\n過快的心律讓人有些目眩\n交感作用下放大的瞳孔半晌才慢慢恢復\n\n視線焦點從遠處回到眼前\n再喘上一口氣\n踏上實地，停在原地張望\n彷彿剛從夢裡驚醒的清晨\n一秒，兩秒\n隨回復平穩的一吸一吐，邁步。"]}];

function log(msg, type='') {
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += `<span class="${type}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

async function doImport() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return alert('請輸入密碼');
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '匯入中...';
  document.getElementById('log').innerHTML = '';

  log('正在驗證密碼...');
  try {
    const loginRes = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const loginData = await loginRes.json();
    if (!loginData.ok) {
      log('✗ 密碼錯誤', 'err');
      btn.disabled = false; btn.textContent = '開始匯入（23 件作品）';
      return;
    }
    log('✓ 驗證成功', 'ok');
    log(`正在寫入 ${WORKS.length} 件作品...`);

    const res = await fetch('/api/works', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + loginData.token },
      body: JSON.stringify(WORKS)
    });
    if (res.ok) {
      log(`✓ 成功匯入 ${WORKS.length} 件作品！`, 'ok');
      log('');
      log('現在可以關閉這個頁面，重新整理前台就會看到所有作品了 🎉', 'ok');
    } else {
      log('✗ 寫入失敗，請再試一次', 'err');
    }
  } catch(e) {
    log('✗ 連線失敗：' + e.message, 'err');
  }
  btn.disabled = false;
  btn.textContent = '重新匯入';
}
</script>
</body>
</html>
